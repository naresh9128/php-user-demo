services:
  web:
    image: php-user-demo:${IMAGE_TAG:-local}
    build: .
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_NAME: user_demo
      DB_USER: demo_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      COOKIE_SECURE: "0"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/health.php') === 'OK' ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: user_demo
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM users LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql_data:
    name: php_user_demo_mysql_data
